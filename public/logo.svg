<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 100" width="100%" height="100%">
  <!-- Background transparent -->
  <g id="logo-icon">
    <!-- Outer Shield / Hexagon Shape -->
    <path d="M 20 18 L 48 10 L 76 18 L 76 54 C 76 74 48 88 48 88 C 48 88 20 74 20 54 Z" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
    <!-- Inner High-Vis Amber Accent -->
    <path d="M 48 16 L 70 23 L 70 52 C 70 68 48 79 48 79 C 48 79 26 68 26 52 L 26 23 Z" fill="none" stroke="#F97316" stroke-width="2.5" stroke-dasharray="8 3"/>
    <!-- Heavy Industrial Gear / Speed Lightning Emblem -->
    <path d="M 52 24 L 34 50 L 46 50 L 42 74 L 62 46 L 50 46 Z" fill="#F97316" />
    <!-- Small Steel Blue Accent Dot -->
    <circle cx="48" cy="84" r="3" fill="#0284C7" />
  </g>
  
  <g id="logo-text" transform="translate(90, 0)">
    <!-- Main Brand Name -->
    <text x="0" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="34" letter-spacing="1" fill="#0F172A">
      GULF<tspan fill="#F97316">FAST</tspan>
    </text>
    <!-- Sub-brand Tagline -->
    <text x="2" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="2.5" fill="#475569">
      RENTALS &amp; MANPOWER
    </text>
    <!-- KSA Badge Text -->
    <rect x="238" y="56" width="70" height="18" rx="4" fill="#0F172A" />
    <text x="273" y="69" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="9" letter-spacing="1" fill="#F97316" text-anchor="middle">
      SAUDI ARABIA
    </text>
  </g>
</svg>
